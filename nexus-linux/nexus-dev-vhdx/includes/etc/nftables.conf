#!/usr/sbin/nft -f
# NEXUS: SSH throttle cap kernel — thay fail2ban (khong ton RAM, khong ton CPU)
# policy accept: chi chan rate ket noi MOI den port 22, moi thu khac khong doi
flush ruleset

table inet nexus {
    chain input {
        type filter hook input priority filter; policy accept;

        tcp dport 22 ct state established,related accept
        tcp dport 22 ct state new limit rate 6/minute burst 10 packets accept
        tcp dport 22 ct state new limit rate 1/minute burst 3 packets log prefix "NEXUS-SSH-RATE: " drop
        tcp dport 22 ct state new drop
    }
}
