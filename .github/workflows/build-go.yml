name: Build Go Edition (exe nhẹ ~9MB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nexus-go/**'
      - '.github/workflows/build-go.yml'

concurrency:
  group: build-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Vet (kiểm tra tĩnh)
        working-directory: nexus-go
        run: go vet ./...

      - name: Unit test (catalog integrity + preset Gaming + updater)
        working-directory: nexus-go
        run: go test ./... -count=1

      - name: Build Linux (kiểm tra dịch được ở cả 2 nền tảng)
        working-directory: nexus-go
        run: go build -o /tmp/nexus-go-linux .

      - name: Build Windows x64 exe (GUI, không cửa sổ console)
        working-directory: nexus-go
        run: |
          mkdir -p release
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -H windowsgui -X main.buildNumber=${{ github.run_number }}" -o release/NEXUS-Optimizer-Go-x64.exe .
          test -s release/NEXUS-Optimizer-Go-x64.exe || { echo "::error::exe rỗng/thiếu"; exit 1; }
          sha256sum release/NEXUS-Optimizer-Go-x64.exe
          go version -m release/NEXUS-Optimizer-Go-x64.exe | head -20

      - name: Liệt kê kết quả
        run: ls -la nexus-go/release/

      - name: Upload artifact (exe Go)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NEXUS-Optimizer-Go-x64-${{ github.run_number }}
          path: nexus-go/release/*.exe
          if-no-files-found: error
          retention-days: 14

  # v3.5.1: cắt release go-vN TỰ ĐỘNG mỗi khi cả build + perf-test xanh.
  # Trước đây release chỉ cắt khi bấm Run workflow thủ công → các build 29..34 không có
  # release nào → auto-update trong tool (tra releases/latest) bị đứt chuỗi. Job riêng
  # này đảm bảo mọi exe cũ luôn thấy bản mới nhất ngay sau mỗi lần push xanh.
  release:
    name: Cắt release go-vN (auto-update)
    needs: [build-go, perf-test]
    if: ${{ !cancelled() && needs.build-go.result == 'success' && needs.perf-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tải exe đã build từ job build-go
        uses: actions/download-artifact@v4
        with:
          name: NEXUS-Optimizer-Go-x64-${{ github.run_number }}
          path: release

      - name: Tạo GitHub Release go-vN
        uses: softprops/action-gh-release@v2
        with:
          tag_name: go-v${{ github.run_number }}
          name: NEXUS Optimizer Go edition — build #${{ github.run_number }}
          body: |
            **Go edition** — 1 exe duy nhất, KHÔNG Electron/Node.

            - **1 file `NEXUS-Optimizer-Go-x64.exe` (~10MB)** — chạy trực tiếp, không cần cài đặt
            - Khởi động gần như tức thì (<1s), HTTP nội bộ bind cổng trống do Windows cấp
            - UI nhúng sẵn (WebView2 Win10/11); thiếu runtime sẽ tự mở trình duyệt mặc định
            - Đủ tính năng: Tổng quan realtime, 35 tinh chỉnh Windows, Dọn dẹp disk+RAM, Gaming Mode, Tiến trình, Mạng, Script, Tự kiểm tra + webhook Discord, Ảnh chụp, Sao lưu registry, Giao diện
            - Hiệu năng: Timer Resolution tự động, ép xung an toàn, FPS test 2 pha (giữ nhịp mục tiêu + đo TỐI ĐA thật không giới hạn)
            - **v4.5.0 — WINDOWS NEXUS ISO (WinPE thật):**
              • ⭐ `windows-nexus.iso` trong release — Windows PE chính chủ Microsoft (như AOMEI PE Builder), boot ngoài Windows để cứu dữ liệu / diagnose khi Windows hỏng
              • Siêu nhẹ cho gaming thủ: chỉ WMI + PowerShell + StorageWMI (SMART) — không desktop nặng; boot nhanh, mọi ghi chỉ vào RAM disk X:, KHÔNG đụng dữ liệu thật
              • Dashboard đầy đủ ngay console: CPU lõi/luồng, RAM tổng/dùng/còn (GB), ổ đĩa GB dùng, GPU + VRAM, ổ vật lý + S.M.A.R.T, IP LAN
              • NEXUS Dashboard web chạy sẵn — mở từ điện thoại/máy khác cùng LAN: http://<ip>:8080
            - **v4.4.0 — audit #4 + Repair Center + Rescue ISO:**
              • Sửa chữa mới: Tạo điểm khôi phục (Restore Point), xây lại cache icon/thumbnail, đăng ký lại app UWP, quét S.M.A.R.T + volume + thiết bị lỗi (read-only)
              • Fix nguy hiểm giờ có CẢNH BÁO TÁC ĐỘNG riêng (preview trước khi chạy; backend chặn thiếu xác nhận)
              • Process Manager chặn kill process hệ thống (denylist) + bắt buộc đối chiếu tên (chống PID reuse)
              • Updater health-check thật (/api/health + version) — không còn rollback dựa trên PID sống
              • Self-test tổng ĐẠT phải tính cả lỗi FULL; catalog uniqueOrders đúng thật
              • Lỗi ghi đĩa ở mọi mutation Store được ghi nhận qua /api/health; config cũ không mất field tùy chỉnh khi load
              • Screenshot: magic-bytes verify + tên chống trùng + sort nhanh + cap 200; mọi runner Go cap output lúc đọc (256KB)
              • Parser TSV nghiêm: token sai → reject cả dòng (không nuốt âm thầm)
              • Cleanup báo fail thật khi còn file không xóa được
              • ⭐ NEXUS RESCUE ISO (Alpine ~70MB): boot USB → dashboard RAM/GB/CPU/GPU/mạng đầy đủ + web NEXUS truy cập qua LAN — xem release asset nexus-rescue.iso (ghi USB bằng Rufus/Etcher)
              • CI: mkdir release + verify exe; Node 22; bun frozen-lockfile; container legacy bind loopback, bỏ Caddy SSRF route
            - **v4.3.0 — audit #3 (P1×10/P2×7):** CLEANUP RAM-ONLY KHÔNG CÒN XÓA FILE NGẦM (goroutine Disk giờ chỉ spawn khi action disk/all — bug nguy hiểm nhất); Self-test FULL không revert khi apply thất bại (không ghi default đoán); perfRestore trả CPU MIN KHÔNG activate High Perf + verify CUỐI plan active = plan gốc; snapshot perf fail-closed (load/persist lỗi → bỏ qua bước, read-modify-write không mất HAGS/CPU-MIN); PERF snapshot+restore CUSTOM GPU LOCK người dùng có trước khi ép xung; Discord IFEO không ghi khi snapshot lỗi; snapshot Registry dùng strict query (access denied ≠ 'không có'); BCD revert chỉ OK khi xác nhận value vắng; sysOp coordinator bao phủ thêm cleanup/selftest/backup-restore/script-run/timer/GPU-game; Store lỗi persist hiển thị qua /api/health; cleanup folder không đọc được = FAIL thật; regAddValues báo PARTIAL; TSV revertSpec rỗng bị reject; chuẩn hóa runSysExe/nvSmi hết (0 lệnh exe thô)
            - **v4.2.0 — audit #2 (P1×8/P2×10):** Performance ép xung giờ snapshot ĐỦ (HAGS kể cả exists=false + CPU MIN AC/DC + Ultimate plan do app tạo) và restore đầy đủ + verify read-back, Success tổng hợp đúng (planOK/HAGS/Ultimate/CPU-min fail đều được ghi); CPU restore KHÔNG đổi power plan người dùng đã chọn lại sau unlock; GPU restore PENDING khi driver mất (giữ snapshot retry); GPU clock read-back verify + wording đúng giới hạn driver; fix Services Restart + Printer bỏ OR — verify STOPPED/RUNNING thật; fixSearch chỉ nhận STOPPED rõ (output rỗng = UNKNOWN); Self-test FULL KHÔNG tự chạy Appx removal (khó đảo ngược); System Operation Coordinator chặn thao tác chồng (409); nvidia-smi dùng đường dẫn resolved + runSysExe chuẩn hóa
            - **v4.1.0 — 10 phát hiện audit đã sửa:** 🔒 Snapshot/Restore EXACT: CPU unlock snapshot đủ scheme+MIN/MAX+AC/DC, GPU power trả mức Current (không Default), GPU clock trả custom lock cũ; AppOpt/Unlock không xóa snapshot khi restore thất bại (retry được), persist lỗi → ABORT trước khi đụng máy; ❌ FALSE-SUCCESS hết: Defender bỏ điều kiện OR + verify sc query, Search tổng hợp stop/delete/start, Tweak engine phân biệt query-error ≠ not-found, sc start fail = fail, powercfg DC phân loại desktop/laptop; 🎮 Gaming không ghi đè ngoài preset (win-sysresp); 🛠️ Services restore theo snapshot StartType từng service (Manual→Manual, Delayed→Delayed) + start lại service vốn chạy; ⬇️ Updater pin đúng tag + SHA-256 bắt buộc khớp + health-check rollback
            - **v4.0.0 mới:** 🔓 Unlock giới hạn CPU/GPU (bỏ trần throttle power plan + Power Throttling, mở power limit NVIDIA tối đa, khóa xung GPU tối đa — snapshot gốc + hoàn tác đúng trạng thái), 4 fix mới (DISM+SFC phục hồi file hệ thống, xây lại chỉ mục Windows Search, cập nhật Defender, đồng bộ đồng hồ), App Optimizer thêm Steam + OneDrive (gỡ tự khởi động, hoàn tác trả chuỗi gốc)
            - Dữ liệu lưu `%APPDATA%\NEXUS Optimizer\config.json`

            > File chưa ký số (no code signing) — Windows SmartScreen có thể hỏi "More info → Run anyway".
            > Bản Electron cũ vẫn ở các release `win-x64-v*` nếu cần quay lại.
          files: release/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # v4.4.0: NEXUS RESCUE ISO — Alpine-based (nhẹ ~70MB), boot USB → dashboard cấu hình đầy đủ
  # (RAM/GB dùng/CPU/GPU/đĩa) + chạy NEXUS web truy cập qua LAN. Không WinPE ADK nặng.
  build-rescue-iso:
    name: Build NEXUS Rescue ISO (Alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-go]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Linux binary cho ISO
        working-directory: nexus-go
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.buildNumber=${{ github.run_number }}" -o /tmp/nexus-linux .
          test -s /tmp/nexus-linux || { echo "::error::binary rỗng"; exit 1; }

      - name: Tải Alpine virt ISO (pin + fallback)
        run: |
          mkdir -p /tmp/iso
          cd /tmp/iso
          for V in alpine-virt-3.21.3-x86_64.iso alpine-virt-3.22.1-x86_64.iso alpine-virt-3.21.2-x86_64.iso; do
            BR=$(echo "$V" | sed -E 's/alpine-virt-([0-9]+\.[0-9]+)\.[0-9]+.*/\1/')
            URL="https://dl-cdn.alpinelinux.org/alpine/v$BR/releases/x86_64/$V"
            echo "Thử $URL"
            curl -sfL --connect-timeout 15 --max-time 180 -o base.iso "$URL" && { echo "Tải được: $V"; break; }
          done
          test -s base.iso || { echo "::error::Không tải được Alpine ISO"; exit 1; }
          ls -la base.iso

      - name: Tạo NEXUS overlay (apkovl) — dashboard + autorun
        run: |
          mkdir -p /tmp/iso/ov/etc/local.d /tmp/iso/ov/etc/runlevels/default /tmp/iso/ov/usr/bin
          cp /tmp/nexus-linux /tmp/iso/ov/usr/bin/nexus
          chmod +x /tmp/iso/ov/usr/bin/nexus
          # symlink autorun: service local chạy script local.d/*.start ở runlevel default
          ln -sf /etc/init.d/local /tmp/iso/ov/etc/runlevels/default/local
          cp nexus-go/rescue/nexus.start /tmp/iso/ov/etc/local.d/nexus.start
          chmod +x /tmp/iso/ov/etc/local.d/nexus.start
          tar -czf /tmp/iso/nexus.apkovl.tar.gz -C /tmp/iso/ov etc usr
          ls -la /tmp/iso/nexus.apkovl.tar.gz

      - name: Chèn overlay vào ISO (pycdlib — giữ nguyên El Torito boot)
        run: |
          python3 -m pip install --quiet pycdlib
          python3 nexus-go/rescue/make_iso.py /tmp/iso/base.iso /tmp/iso/nexus.apkovl.tar.gz /tmp/iso/nexus-rescue.iso
          ls -la /tmp/iso/nexus-rescue.iso
          sha256sum /tmp/iso/nexus-rescue.iso

      - name: Upload ISO vào release go-vN
        uses: softprops/action-gh-release@v2
        with:
          tag_name: go-v${{ github.run_number }}
          files: /tmp/iso/nexus-rescue.iso
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifact ISO (nếu release step lỗi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-rescue-iso
          path: /tmp/iso/nexus-rescue.iso


  # v4.5.0: WINDOWS NEXUS ISO — WinPE chính chủ Microsoft (như AOMEI PE Builder) cho gaming thủ:
  # boot ngoài Windows → dashboard cấu hình đầy đủ + NEXUS web qua LAN. Siêu nhẹ: chỉ WMI +
  # PowerShell + StorageWMI (SMART); không desktop env; mọi ghi chỉ trong RAM disk X:.
  build-windows-pe:
    name: Build Windows NEXUS ISO (WinPE gaming ultra-light)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [release]   # đoi release cat xong đe nap exe + upload ISO vao cung tag go-vN
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cai WinPE add-on (choco) - ISO tao bang pycdlib, khong can ADK base
        shell: powershell
        timeout-minutes: 30
        run: |
          # Bai hoc run 58-64: ADK base installer tren runner khong on dinh (exit 1000,
          # registry stub VS SDK che path) -> DUY NHAT can la PE add-on (media template +
          # boot.wim + WinPE_OCs). ISO tao bang python pycdlib (El Torito BIOS+UEFI) -
          # khong copype, khong oscdimg, khong registry.
          choco install -y --no-progress vcredist2010
          choco install -y --no-progress windows-adk-winpe
          $pe = "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment"
          if (-not (Test-Path $pe)) { $pe = "C:\Program Files\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment" }
          # Tim toan bo boot.wim trong add-on (run truoc: Media\sources co the thu)/ chua ro)
          $wims = Get-ChildItem $pe -Recurse -Filter boot.wim -ErrorAction SilentlyContinue
          $wims | ForEach-Object { Write-Host "boot.wim: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }
          if ($wims.Count -eq 0) {
            Get-ChildItem $pe -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "PE add-on KHONG co boot.wim nao - choco windows-adk-winpe thieu media. Fix: tai adkwinpesetup.exe truc tiep fwlink"
          }
          $src = $wims[0].Directory.Parent.FullName
          if (-not (Test-Path "C:\winpe\media\sources\boot.wim")) {
            robocopy "$pe\amd64\media" C:\winpe\media /E /NFL /NDL /NJH /NJS
          }
          if (-not (Test-Path "C:\winpe\media\sources\boot.wim")) {
            New-Item -ItemType Directory -Force -Path C:\winpe\media\sources | Out-Null
            Copy-Item $wims[0].FullName C:\winpe\media\sources\boot.wim -Force
            Write-Host "copy boot.wim tu $($wims[0].FullName)"
          }
          Write-Host "ADK PE OK: $pe"

      - name: Tai exe NEXUS tu release go-vN
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\out | Out-Null
          gh release download go-v${{ github.run_number }} --repo ${{ github.repository }} --pattern "*.exe" --dir C:\out
          Get-ChildItem C:\out

      - name: Tao workspace PE + mount + inject NEXUS
        shell: powershell
        run: |
          $pe  = "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment"
          if (-not (Test-Path $pe)) { $pe = "C:\Program Files\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment" }
          if (-not (Test-Path "$pe\amd64\WinPE_OCs")) {
            Get-ChildItem "$pe" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 30 -ExpandProperty FullName
            throw "WinPE_OCs amd64 thieu - ADK/add-on chua dung version"
          }
          if (-not (Test-Path "C:\winpe\media\sources\boot.wim")) {
            # stage media template truc tiep tu add-on (bo qua copype - khong can registry)
            robocopy "$pe\amd64\media" C:\winpe\media /E /NFL /NDL /NJH /NJS
            if ($LASTEXITCODE -ge 8) { throw "media robocopy failed - $pe\amd64\media thieu" }
          }
          # Mount image index 1 (real PE - not Setup)
          dism /Mount-Image /ImageFile:C:\winpe\media\sources\boot.wim /Index:1 /MountDir:C:\winpe\mount
          if ($LASTEXITCODE -ne 0) { throw "mount boot.wim failed" }
          # NEXUS vao image
          New-Item -ItemType Directory -Force -Path C:\winpe\mount\NEXUS | Out-Null
          Copy-Item C:\out\*.exe C:\winpe\mount\NEXUS\nexus.exe -Force
          Copy-Item nexus-go\rescue\pe\startnet.cmd C:\winpe\mount\Windows\System32\startnet.cmd -Force
          Copy-Item nexus-go\rescue\pe\nexus-dashboard.ps1 C:\winpe\mount\NEXUS\nexus-dashboard.ps1 -Force
          Copy-Item nexus-go\rescue\pe\nexus-offline-tune.ps1 C:\winpe\mount\NEXUS\nexus-offline-tune.ps1 -Force
          Copy-Item nexus-go\rescue\pe\nexus-apps.ps1 C:\winpe\mount\NEXUS\nexus-apps.ps1 -Force
          # Minimal packages (ultra-light): WMI first (PowerShell needs it), then PowerShell, StorageWMI (SMART)
          $ocs = "$pe\amd64\WinPE_OCs"
          foreach ($p in @("WinPE-WMI","WinPE-PowerShell","WinPE-StorageWMI")) {
            dism /Image:C:\winpe\mount /Add-Package /PackagePath:"$ocs\$p.cab"
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::$p base add failed (may already exist) - continue" }
            dism /Image:C:\winpe\mount /Add-Package /PackagePath:"$ocs\en-us\$p.cab"
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::$p en-us add failed - continue" }
          }
          # Commit - boot.wim in media updated in place
          dism /Unmount-Image /MountDir:C:\winpe\mount /Commit
          if ($LASTEXITCODE -ne 0) { throw "unmount commit failed" }

      - name: Tao ISO (pycdlib) + verify
        shell: powershell
        run: |
          python -m pip install --quiet pycdlib
          python nexus-go\rescue\pe\make_winpe_iso.py
          $iso = Get-Item C:\out\windows-nexus.iso
          Write-Host "ISO: $($iso.Length) bytes ($([math]::Round($iso.Length/1MB,1)) MB)"
          if ($iso.Length -lt 150MB) { throw "ISO qua nho - boot.wim khong duoc inject?" }
          if ($iso.Length -gt 900MB) { throw "ISO qua lon - review packages" }
          # Verify image 1 chua NEXUS + startnet + dashboard + 2 script gaming
          dism /Get-ImageInfo /ImageFile:C:\winpe\media\sources\boot.wim
          dism /Mount-Image /ImageFile:C:\winpe\media\sources\boot.wim /Index:1 /MountDir:C:\winpe\mount2
          foreach ($f in @("C:\winpe\mount2\NEXUS\nexus.exe","C:\winpe\mount2\Windows\System32\startnet.cmd","C:\winpe\mount2\NEXUS\nexus-dashboard.ps1","C:\winpe\mount2\NEXUS\nexus-offline-tune.ps1","C:\winpe\mount2\NEXUS\nexus-apps.ps1")) {
            if (-not (Test-Path $f)) { throw "missing in image: $f" }
            Write-Host "OK: $f ($((Get-Item $f).Length) B)"
          }
          dism /Unmount-Image /MountDir:C:\winpe\mount2 /Discard
          Get-FileHash C:\out\windows-nexus.iso -Algorithm SHA256 | Format-List

      - name: Upload windows-nexus.iso vao release go-vN
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload go-v${{ github.run_number }} C:\out\windows-nexus.iso --repo ${{ github.repository }} --clobber
          Write-Host "Uploaded windows-nexus.iso to release go-v${{ github.run_number }}"

  # v3.5.0: tự test Hiệu năng — ép xung TRƯỚC, rồi FPS test xem có tăng không (60 → 120),
  # tự chụp ảnh bằng chứng (đã chỉnh FPS, đã bấm Tối ưu, FPS đạt).
  perf-test:
    name: Render benchmark + smoke CI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build tool (Linux — CI mô phỏng tác dụng thật của Windows)
        working-directory: nexus-go
        run: go build -o /tmp/sakura-tool .

      - name: Khởi động tool (--port cố định 32199)
        run: |
          /tmp/sakura-tool --web --port 32199 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:32199/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:32199/api/health

      - name: Lấy token phiên (v3.9.0 tokenGuard - audit P1-07)
        run: |
          TOK=$(curl -sf http://127.0.0.1:32199/ | grep -o '__nexus_token="[a-f0-9]*"' | cut -d'"' -f2)
          [ -n "$TOK" ] || { echo "❌ Không lấy được token phiên từ UI"; exit 1; }
          echo "API_TOKEN=$TOK" >> "$GITHUB_ENV"
          echo "Token phiên: ${TOK:0:8}…"

      - name: Bước 1 — Test ép xung qua API (trước khi test FPS)
        run: |
          OC=$(curl -sf -X POST http://127.0.0.1:32199/api/perf/overclock -H 'Content-Type: application/json' -H "X-Nexus-Token: $API_TOKEN" -d '{"level":"balanced"}')
          echo "$OC"
          echo "$OC" | jq -e '.success == true' > /dev/null || { echo "❌ Ép xung FAIL"; exit 1; }
          TR=$(curl -sf -X POST http://127.0.0.1:32199/api/perf/timer-resolution -H 'Content-Type: application/json' -H "X-Nexus-Token: $API_TOKEN" -d '{"action":"auto"}')
          echo "$TR"
          echo "$TR" | jq -e '.success == true' > /dev/null || { echo "❌ Timer resolution FAIL"; exit 1; }
          echo "✅ Ép xung + timer resolution OK (chế độ mô phỏng CI — Windows sẽ gọi nvidia-smi/powercfg/ntdll thật)"

      - name: Bước 2 — Test FPS trong trình duyệt (baseline 60 → sau Tối ưu 120)
        working-directory: nexus-go
        run: |
          npm init -y >/dev/null 2>&1
          npm i puppeteer-core@23 --no-fund --no-audit
          node ci/fps-benchmark.mjs

      - name: Bước 3 — Kiểm tra ảnh FPS test không trống
        run: |
          ls -la nexus-go/ci/shots/
          for f in nexus-go/ci/shots/*.png; do
            sz=$(stat -c%s "$f")
            [ "$sz" -gt 15000 ] || { echo "❌ Ảnh $f quá nhỏ ($sz byte) — có thể chụp trống"; exit 1; }
          done
          echo "✅ 4 ảnh FPS test đều có nội dung (baseline 60, FPS=120, Tối ưu, kết quả sau)"

      - name: Upload artifact (ảnh bằng chứng FPS test)
        uses: actions/upload-artifact@v4
        with:
          name: fps-test-screenshots-${{ github.run_number }}
          path: nexus-go/ci/shots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Ghi tóm tắt vào job summary
        if: always()
        run: |
          [ -f nexus-go/ci/fps-summary.md ] && cat nexus-go/ci/fps-summary.md >> $GITHUB_STEP_SUMMARY || true

  win11-iso:
    if: github.event_name == 'workflow_dispatch'
    name: Build Win11 Pro 24H2 Gaming ISO (Debloated + Tuned)
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fido Rufus -> lay link ISO Win11 24H2 chinh chu + tai ve (~5.5GB)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path C:\Fido | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/pbatard/Fido/raw/master/Fido.ps1' -OutFile C:\Fido\Fido.ps1 -UseBasicParsing
          Write-Host "Fido.ps1 size: $((Get-Item C:\Fido\Fido.ps1).Length) bytes"
          # Bai hoc run truoc: PS5.1 silent fail khong output -> dung pwsh 7 + PS5.1 luot doi,
          # PlatformArch x64 de bo WMI, capture 2>&1, IN RA RAW de debug. Bai hoc run 64:
          # khong bao gio Trim() tren null - regex extract.
          # Bug run truoc: $args la AUTOMATIC VARIABLE -> gan bi nuot -> & pwsh khong arg -> REPL silent!
          Write-Host '===== FIDO direct call (pwsh7) ====='
          & C:\Fido\Fido.ps1 -Win 11 -Rel Latest -Lang Vietnamese -Arch x64 -PlatformArch x64 -GetUrl 2>&1 | Tee-Object -Variable fidoOut
          Write-Host "FIDO exit: $LASTEXITCODE"
          $raw = $fidoOut | Out-String
          $url = [regex]::Match($raw, 'https://[^\s]*\.iso[^\s]*').Value
          if (-not $url) {
            Write-Host '===== FIDO PS5.1 retry ====='
            & powershell -NoProfile -ExecutionPolicy Bypass -File C:\Fido\Fido.ps1 -Win 11 -Rel Latest -Lang Vietnamese -Arch x64 -PlatformArch x64 -GetUrl 2>&1 | Tee-Object -Variable fidoOut2
            Write-Host "FIDO PS5.1 exit: $LASTEXITCODE"
            $raw2 = $fidoOut2 | Out-String
            $url = [regex]::Match($raw2, 'https://[^\s]*\.iso[^\s]*').Value
          }
          if (-not $url) {
            Write-Host '===== FALLBACK python MS connector (Fido that bai) ====='
            python nexus-go\rescue\win11\ms_connector.py 2>&1 | Tee-Object -Variable msOut
            $raw3 = $msOut | Out-String
            $url = [regex]::Match($raw3, 'NEXUS-ISO-URL=(https://\S+)').Groups[1].Value
          }
          Write-Host "ISO URL: $url"
          if (-not $url) { throw "Ca Fido lan python MS connector deu khong lay duoc URL - xem log tren" }
          $url | Out-File C:\Fido\iso-url.txt -Encoding ascii
          curl.exe -L --retry 3 --retry-delay 5 -o C:\win11-original.iso $url
          $iso = Get-Item C:\win11-original.iso
          Write-Host "ISO goc: $([math]::Round($iso.Length/1GB,2)) GB"
          if ($iso.Length -lt 4GB) { throw "ISO goc qua nho - download loi?" }

      - name: Tune install.wim (debloat AppX + registry offline + LabConfig + Pro-only)
        shell: powershell
        timeout-minutes: 35
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File nexus-go\rescue\win11\tune-install-wim.ps1 C:\win11-original.iso

      - name: Tao ISO (pycdlib UDF) + verify
        shell: powershell
        timeout-minutes: 12
        run: |
          python nexus-go\rescue\win11\make_win11_iso.py
          $iso = Get-Item C:\out\Win11Pro-NEXUS-24H2-Gaming.iso
          Write-Host "ISO: $([math]::Round($iso.Length/1GB,2)) GB"
          if ($iso.Length -lt 2.5GB) { throw "ISO qua nho" }
          dism /Get-ImageInfo /ImageFile:C:\win11src\sources\install.wim
          $info = Get-WindowsImage -ImagePath C:\win11src\sources\install.wim
          if ($info.Count -ne 1) { throw "install.wim phai chi con 1 image (Pro)" }
          Write-Host "Image duy nhat: $($info.ImageName)"

      - name: 7z split <2GB + merge.bat + SHA256 (gioi han asset GitHub 2GB/file)
        shell: powershell
        timeout-minutes: 10
        run: |
          $sz = 'C:\Program Files\7-Zip\7z.exe'
          & $sz a -t7z -mx=0 -v1900m C:\out\Win11NEXUS-24H2.7z C:\out\Win11Pro-NEXUS-24H2-Gaming.iso | Select-Object -Last 5
          $parts = Get-ChildItem C:\out\Win11NEXUS-24H2.7z.* | Sort-Object Name
          $parts | ForEach-Object { Write-Host "$($_.Name): $([math]::Round($_.Length/1GB,2)) GB" }
          $merge = "@echo off`r`nREM Ghep lai: copy /b 001+002+003 -> ISO (hoac mo .001 bang 7-Zip/WinRAR de giai nen)`r`ncopy /b `"Win11NEXUS-24H2.7z.001`"+`"Win11NEXUS-24H2.7z.002`"+`"Win11NEXUS-24H2.7z.003`" `"Win11Pro-NEXUS-24H2-Gaming.iso`"`r`necho Done: Win11Pro-NEXUS-24H2-Gaming.iso`r`npause`r`n"
          [IO.File]::WriteAllText('C:\out\merge.bat', $merge)
          $readme = "NEXUS Win11 Pro 24H2 Gaming ISO - huong dan`r`n=============================================`r`n1. Tai du 3 phan: Win11NEXUS-24H2.7z.001/.002/.003 cung thu muc`r`n2. De giai nen: mo file .001 bang 7-Zip hoac WinRAR -> duoc file ISO`r`n   (hoac chay merge.bat de ghep thanh ISO roi ghi ra USB bang Rufus)`r`n3. Ghi USB: Rufus (chon GPT/UEFI), boot, cai dat`r`n`r`nDa san co:`r`n- Debloat: 25+ app UWP rac (Bing/Copilot/Teams/Skype/Solitaire/Maps/YourPhone...)`r`n- Game: HAGS bat, GameDVR tat (FPS tang), Game Mode bat, GPU Priority 8, timer resolution, Power Throttling tat, SysMain tat, Ultimate Performance (first boot)`r`n- Telemetry/ads tat, tat deal ao & suggest app, khoi 24H2 (khong tu nang cap LTS style)`r`n- Boot cu: bypass TPM/SecureBoot/RAM/CPU (may cu van cai duoc)`r`n- OOBE: user 'Gamer' (khong mat khau, tu dong dang nhap) - doi mat khau sau khi vao`r`n- FirstBoot tu chay: tune HKCU + power Ultimate + winget cai Discord/Steam/Chrome/Opera GX (can internet)`r`n- Da go OneDrive consumer - Store/Photos/Calculator/Notepad/Terminal/Xbox (Game Pass) giu nguyen`r`n`r`nSafety: Defender giu nguyen. Log first boot: C:\NEXUS\FirstBoot.log. Re-run apps: shortcut NEXUS Gaming Setup.`r`n"
          [IO.File]::WriteAllText('C:\out\README-NEXUS-Win11.txt', $readme)
          Get-ChildItem C:\out\Win11NEXUS-24H2.7z.* | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Out-File C:\out\SHA256.txt -Append -Encoding utf8 }
          Get-FileHash C:\out\Win11Pro-NEXUS-24H2-Gaming.iso -Algorithm SHA256 | Out-File C:\out\SHA256.txt -Append -Encoding utf8

      - name: Upload ISO parts vao release go-vN
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload go-v${{ github.run_number }} C:\out\Win11NEXUS-24H2.7z.001 C:\out\Win11NEXUS-24H2.7z.002 C:\out\Win11NEXUS-24H2.7z.003 C:\out\merge.bat C:\out\README-NEXUS-Win11.txt C:\out\SHA256.txt --repo ${{ github.repository }} --clobber
          Write-Host "Uploaded Win11 ISO parts to release go-v${{ github.run_number }}"
