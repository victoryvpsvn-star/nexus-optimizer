name: Build NEXUS Linux Dev (terminal cho dev — Debian base, Hyper-V ready)

on:
  push:
    branches: [main]
    paths: ['nexus-linux/**', '.github/workflows/build-linux-dev.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-dev-iso:
    name: NEXUS Linux Dev — live-build Debian bookworm
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate package list (fail fast — không đợi live-build chết giữa đường)
        run: bash nexus-linux/validate-packages.sh nexus-linux/nexus-dev/config/package-lists/nexus-dev.list.chroot

      - name: Build ISO trong container Debian bookworm (live-build của Debian — sinh suite security đúng)
        run: |
          docker run --rm --privileged -v "$PWD":/ws -w /ws debian:bookworm bash -euxo pipefail -c '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends live-build xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin syslinux-common isolinux mtools dosfstools file >/dev/null
            cd nexus-linux/nexus-dev
            sh ./auto/config
            lb build 2>&1 | tee /tmp/lb.log
            ISO=$(ls -1 live-image-amd64*.iso 2>/dev/null | head -1 || true)
            test -n "$ISO" || { echo "::error::lb build không xuất ISO — đuôi log:"; tail -60 /tmp/lb.log; exit 1; }
            echo "lb output: $ISO"
            mv "$ISO" nexus-linux-dev.iso
            sha256sum nexus-linux-dev.iso
            file nexus-linux-dev.iso
            xorriso -indev nexus-linux-dev.iso -report_el_torito as_mkisofs | head -25
            SIZE=$(stat -c%s nexus-linux-dev.iso)
            test "$SIZE" -gt 300000000 || { echo "::error::ISO quá nhỏ: $SIZE"; exit 1; }
            echo "ISO OK: $SIZE bytes"
          ' 

      - name: Upload release nexus-linux-dev-v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-linux-dev-v3
          name: NEXUS Linux Dev v3 — Terminal cho dev (Debian base)
          body: |
            **NEXUS Linux Dev v3 (ULTRA SLIM)** — nhẹ nhất có thể mà vẫn xịn. Base Debian bookworm, KHÔNG Alpine, tool kiểu Kali, vẫn NEXUS OS.

            **Kích thước:** v1 1.5GB → v2 1.2GB → **v3 ~850MB** (squashfs nén xz)

            **Mục tiêu resource giữ nguyên:** VM **1GB RAM / 0.25 core / disk 2GB** vẫn chạy (live boot từ ISO, zram swap 50% RAM + earlyoom).

            **Triết lý v3:** giữ tool identity, cắt thứ `nx install` phục hồi trong 1 phút:
            - Giữ: python3 + pip + scapy + impacket, nmap, masscan, tcpdump, sqlmap, hydra, john, binwalk, dirb, whatweb, exiftool, sshuttle, macchanger, proxychains4, git, tmux, vim, ripgrep, fzf, fd-find, ncdu, jq, sqlite3, btop, strace, openssh-client, curl/wget/rsync
            - Cắt: build-essential/gdb (compiler — `nx install build-essential gdb` phục hồi), nodejs+npm (`nx install nodejs npm`), gnupg, neovim, aria2, p7zip-full, wfuzz
            - **nx 1.1**: tự `apt-get update` lần đầu (ISO slim không chứa apt lists) — `nx install` chạy được ngay
            - **pip.conf break-system-packages**: `pip install` chạy thẳng kiểu Kali, không cần venv
            - Kernel **cloud-amd64** (tối ưu Hyper-V/KVM; máy thật có thể thiếu driver WiFi), không recommends, không man/docs/locale/icons

            **Hyper-V Gen 2:** New VM → Generation 2 → RAM 1024MB → 1 vCPU → boot ISO → tự login `nexus` → `nexfetch`. Security: tắt Secure Boot (hoặc template Microsoft UEFI CA).

            Thêm tool: sửa `nexus-linux/nexus-dev/config/package-lists/nexus-dev.list.chroot` + push — CI tự build lại.
          files: nexus-linux/nexus-dev/nexus-linux-dev.iso

  build-dev-vhdx:
    name: NEXUS Linux Dev — VHDX cài sẵn (Hyper-V Gen 2 + updisk)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build VHDX (debootstrap → ext4 tại offset + ESP mtools → qemu-img, không losetup)
        run: |
          docker run --rm --privileged -v "$PWD":/ws -w /ws debian:bookworm bash -euo pipefail -c '
            bash nexus-linux/nexus-dev-vhdx/build-vhdx.sh 2>&1 | tee /tmp/vhdx.log
            test -f nexus-linux-dev.vhdx || { echo "::error::không tạo được VHDX — đuôi log:"; tail -60 /tmp/vhdx.log; exit 1; }
            ls -la nexus-linux-dev.vhdx
            echo "=== boot smoke-test: qemu + OVMF UEFI (proof: boot + ssh + network + port 22) ==="
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 ovmf expect >/dev/null
            qemu-img convert -O raw nexus-linux-dev.vhdx /tmp/test.raw
            # NPS E2E co the flaky tren TCG (nx install tree doc repo trong RAM) — run #57 fail / #58 xanh cung commit
            # -> retry toi da 2 lan; ca 2 fail moi coi la loi that
            ok=0
            for attempt in 1 2; do
              cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/OVMF_VARS.fd
              if expect -f nexus-linux/nexus-dev-vhdx/boot-test.exp 2>&1 | tee /tmp/boot-test.log; then ok=1; break; fi
              echo "=== boot-test lan $attempt FAIL — retry ==="
            done
            [ "$ok" = "1" ] || { echo "::error::boot smoke-test fail ca 2 lan"; exit 1; }
            grep -q "BOOT TEST PASS" /tmp/boot-test.log
          '

      - name: Upload release nexus-linux-dev-vhdx
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-linux-dev-vhdx
          name: NEXUS Linux Dev — VHDX cài sẵn cho Hyper-V (boot UEFI Gen 2, lệnh updisk)
          body: |
            **NEXUS Linux Dev VHDX** — hệ Debian bookworm **CÀI SẴN** trong disk (không phải ISO/live), boot UEFI Hyper-V Gen 2, kèm lệnh `updisk`.

            **Cách dùng:**
            1. Tải `nexus-linux-dev.vhdx` → Hyper-V: New VM → **Generation 2** → Attach existing disk → chọn file vhdx → Security: **tắt Secure Boot**
            2. RAM 1024MB+ / 1 vCPU đủ chạy. Boot xong tự login `nexus` (mật khẩu `nexus`, sudo NOPASSWD; root mật khẩu `root`)
            3. **SSH được ngay**: `ssh nexus@<ip>` — openssh-server cài sẵn

            **Lệnh `updisk`** — sau khi nâng disk VM (ví dụ 1GB → 8GB ở Hyper-V/panel): gõ `updisk` → tự growpart + resize2fs, rootfs chiếm hết vùng trống, không cần restart. Chưa nâng gì thì báo "không còn vùng trống".

            **Trong đó:** toàn bộ toolset v3 (nmap, sqlmap, hydra, john, binwalk, python3+scapy+impacket, git, tmux, vim, ripgrep, fzf, ncdu, jq, sqlite3, btop, strace, zram swap + earlyoom), `nx install` tự apt-get update lần đầu, `pip install` kiểu Kali. Disk base tự đo dung lượng khi build (≥2GB). Kernel cloud-amd64 (Hyper-V/KVM).

            Build script: `nexus-linux/nexus-dev-vhdx/build-vhdx.sh`.
          files: nexus-linux-dev.vhdx

      - name: Artifact dự phòng
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-dev-vhdx
          path: nexus-linux-dev.vhdx
          retention-days: 7

      - name: Artifact dự phòng
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-dev-iso
          path: nexus-linux/nexus-dev/nexus-linux-dev.iso
          retention-days: 7

  build-nano-vhdx:
    name: NEXUS NANO — VHDX siêu nhẹ (kernel mini + busybox + dropbear + NPS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build NANO VHDX (kernel 6.1.100-nexus1 mini + busybox + dropbear + NPS — không systemd/modules/initramfs)
        run: |
          docker run --rm --privileged -v "$PWD":/ws -w /ws debian:bookworm bash -euo pipefail -c '
            bash nexus-linux/nexus-nano/build-nano.sh 2>&1 | tee /tmp/nano.log
            test -f nexus-linux-nano.vhdx || { echo "::error::không tạo được NANO VHDX — đuôi log:"; tail -60 /tmp/nano.log; exit 1; }
            NANO_SIZE=$(stat -c%s nexus-linux-nano.vhdx)
            echo "NANO VHDX: $NANO_SIZE bytes"
            test "$NANO_SIZE" -lt 200000000 || { echo "::error::NANO quá nặng: $NANO_SIZE (mục tiêu <= ~160MB)"; exit 1; }
            echo "=== boot smoke-test NANO: qemu + OVMF UEFI (kernel + dropbear 22 + NPS) ==="
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 ovmf expect >/dev/null
            qemu-img convert -O raw nexus-linux-nano.vhdx /tmp/nano-test.raw
            cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/OVMF_VARS.fd
            expect -f nexus-linux/nexus-nano/boot-test-nano.exp 2>&1 | tee /tmp/nano-boot.log
            grep -q "NANO TEST PASS" /tmp/nano-boot.log
          '

      - name: Upload release nexus-nano-v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-nano-v1
          name: NEXUS NANO v1 — VHDX siêu nhẹ (kernel nexus mini + busybox + dropbear + NPS)
          body: |
            **NEXUS NANO v1** — bản siêu nhẹ tự build 100%: kernel NEXUS mini 6.1.100-nexus1 (allnoconfig, driver builtin, KHÔNG modules, KHÔNG initramfs, KHÔNG systemd) + busybox + dropbear + NPS (nx).

            **Mục tiêu resource: disk VHDX ~<=160MB · RAM idle ~20-50MB · CPU ~0 (0.25 vCPU vẫn dư)**

            **Cách dùng:** Hyper-V Gen 2 → RAM 512MB đủ → 0.25-1 vCPU → attach disk → tắt Secure Boot → SSH root@ip (mk: root). Console serial có sh trực tiếp.

            **Có gì:** nx install|remove|search|info|list|verify (NPS — repo nội bộ NEXUS), SSH rate-limit nftables (kernel, 0 RAM), zram 32MB, udhcpc DHCP.

            **Lưu ý thẳng thắn:** nano KHÔNG có gcc/node/python (dev toolchain không thể vừa disk ~100MB — riêng gcc cần ~350MB) — dev thật dùng bản Dev (kernel full + userland Debian, đã gỡ repo ngoài). Nano hợp cho: VPS 0.25 vCPU, jump box, router/tunnel, cứu hộ, học Linux.

            Build script: `nexus-linux/nexus-nano/build-nano.sh`.
          files: nexus-linux-nano.vhdx

  build-nano-iso:
    name: NEXUS NANO v2 — LIVE ISO (rootfs trong RAM, boot DVD Hyper-V Gen 2 không cần driver disk)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build NANO v2 ISO + boot test UEFI (qemu OVMF, -cdrom, KHÔNG disk)
        run: |
          docker run --rm --privileged -v "$PWD":/ws -w /ws debian:bookworm bash -euo pipefail -c '
            bash nexus-linux/nexus-nano/build-nano-iso.sh 2>&1 | tee /tmp/nano-iso.log
            test -f nexus-v2.iso || { echo "::error::không tạo được ISO — đuôi log:"; tail -60 /tmp/nano-iso.log; exit 1; }
            ls -la nexus-v2.iso
            sha256sum nexus-v2.iso
            echo "=== boot test ISO: qemu + OVMF UEFI + -cdrom (rootfs initramfs trong RAM) ==="
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 ovmf expect >/dev/null
            cp nexus-v2.iso /tmp/nexus-test.iso
            cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/OVMF_VARS.fd
            expect -f nexus-linux/nexus-nano/boot-test-nano-iso.exp 2>&1 | tee /tmp/nano-iso-boot.log
            grep -q "NANO ISO TEST PASS" /tmp/nano-iso-boot.log
          '

      - name: Upload release nexus-nano-v2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-nano-v2
          name: NEXUS NANO v2 — LIVE ISO (kernel nexus, rootfs trong RAM)
          body: |
            **NEXUS NANO v2** — LIVE ISO chẩn đoán/cứu hộ: kernel NEXUS mini 6.1.100-nexus1 + **rootfs nằm trong initramfs (RAM)** → boot từ DVD **không cần driver disk nào** (storvsc/ahci/virtio không cần để lên hệ).

            **Dùng để chẩn đoán Hyper-V:** gắn ISO vào VM (DVD, GIỮ nguyên disk VHDX cũ):
            - Nếu ISO boot (thấy `NANO-READY` qua COM hoặc ssh được `root`) trong khi VHDX đứng im sau GRUB → vấn đề nằm ở đường disk (storvsc) chứ không phải kernel.
            - Nếu ISO cũng không lên → mở log serial COM để xem kernel chết ở dòng nào.

            **Hyper-V Gen 2:**
            1. `Set-VMDvdDrive -VMName nexus -Path .\nexus-v2.iso`
            2. **Tắt Secure Boot** (kernel unsigned): `Set-VMFirmware -VMName nexus -EnableSecureBoot Off`
            3. COM đọc log: `Set-VMComPort -VMName nexus -Number 1 -Path \\.\pipe\nexus` → PuTTY Serial `\\.\pipe\nexus` 115200 (màn hình video KHÔNG bao giờ in gì sau GRUB — kernel không có framebuffer console)
            4. Boot → `NANO-READY` trên COM → ssh `root@<ip>` (mk `root`) hoặc sh trực tiếp trên COM
            5. `mount -t iso9660 /dev/sr0 /mnt` đọc lại CD (CI test sẵn)

            Boot UEFI only (Gen 2). KHÔNG BIOS/Gen 1. Kernel + config nằm sẵn trên ISO (`/boot/config-nexus.txt` trong ESP).

            Build script: `nexus-linux/nexus-nano/build-nano-iso.sh`.
          files: nexus-v2.iso

      - name: Artifact dự phòng
        uses: actions/upload-artifact@v4
        with:
          name: nexus-nano-iso
          path: nexus-v2.iso
          retention-days: 7

  dispatch-hyperv-test:
    name: Bắn Hyper-V real test sang máy có self-hosted runner
    needs: [build-dev-iso, build-dev-vhdx, build-nano-vhdx, build-nano-iso, ps1-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bắn hyperv-test CHỈ khi có runner 'hyperv' online (tránh run kẹt queued)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ONLINE=$(gh api "repos/${{ github.repository }}/actions/runners" --jq '[.runners[] | select(.online == true and (.labels | map(.name) | index("hyperv") != null))] | length' || echo 0)
          if [ "$ONLINE" -eq 0 ]; then
            echo "::warning::Không có runner 'hyperv' nào online — bỏ qua bắn hyperv-test. Mở ./run.cmd trên máy Windows (self-hosted runner) rồi bấm Run workflow 'Hyper-V real boot test' thủ công."
          else
            gh workflow run hyperv-test.yml --repo "${{ github.repository }}" -f target=both \
              && echo "✅ Đã bắn hyperv-test (runner online). Report nằm ở artifact 'hyperv-report' của run đó."
          fi

  ps1-lint:
    name: Syntax-check hyperv-test.ps1 (hosted Windows — không cần Hyper-V)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parser - 0 errors or fail
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts\hyperv-test.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          Write-Host ("parsed: {0} errors" -f $errors.Count)
          $errors | ForEach-Object { Write-Host ("::error file=scripts/hyperv-test.ps1::line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
          if ($errors.Count -gt 0) { exit 1 }
          Write-Host ("OK - clean parse, {0} tokens" -f $tokens.Count)
