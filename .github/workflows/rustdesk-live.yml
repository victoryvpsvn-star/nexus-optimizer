name: RustDesk live — NEXUS Optimizer wizard (giữ đúng N phút)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Số phút giữ session (mặc định 10)
        required: false
        default: '10'

permissions:
  contents: write
  actions: write

jobs:
  rustdesk-live:
    name: Cai RustDesk + mo wizard — bro remote vao test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: "1/2 Cai RustDesk + lay ID + mo wizard (setup)"
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File nexus-win/optimizer/rustdesk-live.ps1 -Mode setup -Minutes ${{ github.event.inputs.minutes || '10' }}

      - name: Luu session-info (ID + PASSWORD nguyen ven) vao artifact — log bi GitHub AI-mask, artifact KHONG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-info
          path: session-info.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: "2/2 Giu session dung N phut (hold)"
        if: success()
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File nexus-win/optimizer/rustdesk-live.ps1 -Mode hold -Minutes ${{ github.event.inputs.minutes || '10' }}
