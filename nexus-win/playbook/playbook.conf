<?xml version="1.0" encoding="utf-8"?>
<Playbook>
        <Name>NEXUS</Name>
        <Username>NEXUS</Username>
        <Title>NEXUS v1.0.2</Title>
        <ShortDescription>NEXUS Playbook for Windows 11 21H2 - 26H2</ShortDescription>
        <Description><![CDATA[Gaming configuration playbook for AME Wizard: Atlas OS + FSOS-X merged debloat (126 patterns), game registry tuning, telemetry lockdown. Same guardrails: Game Pass, Game Bar, Xbox, Store, winget, Defender stay.]]></Description>
        <Details>Builds 22000 (21H2), 26100 (24H2), 26200 (25H2), 26300 (26H2). Atlas+FSOS-X debloat with deprovision markers, OneDrive strip, gaming registry (HAGS, GPU priority, timer resolution), telemetry lockdown and service tuning - with restore point, backups and install report in C:\Windows\NEXUS.</Details>
        <ProgressText><![CDATA[NEXUS is creating a restore point (optional), backing up state, removing bloatware, tuning gaming registry/services and writing the install report to C:\Windows\NEXUS\install-report.html]]></ProgressText>
        <Version>1.0.2</Version>
        <SupportedBuilds>
                <!-- 21H2 (Windows 11 release dau tien) -->
                <string>22000</string>
                <!-- 24H2 -->
                <string>26100</string>
                <!-- 25H2 -->
                <string>26200</string>
                <!-- 26H2 (Windows 11 2026 Update) -->
                <string>26300</string>
        </SupportedBuilds>
        <UpgradableFrom>any</UpgradableFrom>
        <Requirements>
                <Requirement>PluggedIn</Requirement>
        </Requirements>
        <UniqueId>e5da55b3-8b11-4f36-9d31-1e0d2ac37a42</UniqueId>
        <InstallGuide>https://github.com/victoryvpsvn-star/nexus-optimizer</InstallGuide>
        <Overhaul>true</Overhaul>
        <UseKernelDriver>false</UseKernelDriver>
        <AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>
        <ProductCode>64</ProductCode>
        <EstimatedMinutes>6</EstimatedMinutes>
        <Git>https://github.com/victoryvpsvn-star/nexus-optimizer</Git>
        <Website>https://github.com/victoryvpsvn-star/nexus-optimizer</Website>
        <DonateLink>https://github.com/victoryvpsvn-star/nexus-optimizer</DonateLink>
        <SupportsISO>false</SupportsISO>
        <OOBE>
                <BulletPoints>
                        <BulletPoint Icon="Rocket" Title="Performance"
                        Description="Atlas+FSOS-X merged debloat (126 patterns), game registry tuning (HAGS, GPU priority 8, timer resolution, power throttling off) and service tuning - honest tweaks only, no placebos."/>
                        <BulletPoint Icon="Privacy" Title="Privacy"
                        Description="Telemetry, advertising ID, Delivery Optimization, Windows Consumer Features and all SubscribedContent suggestion channels off - plus scheduled-task lockdown."/>
                        <BulletPoint Icon="Lock" Title="Control"
                        Description="A System Restore point (optional), full AppX/services/tasks backups and an install report of every change. Removed families are deprovisioned so feature updates cannot reinstall them."/>
                </BulletPoints>
                <Internet>Force</Internet>
        </OOBE>
        <FeaturePages>
                <RadioPage IsRequired="true" DefaultOption="nexus-gaming" Description="Choose the NEXUS preset. Both keep the gaming stack (Game Pass, Game Bar, Xbox sign-in), Store, winget, Paint, Snipping Tool and Defender.">
                        <Options>
                                <RadioOption>
                                        <Text>Gaming (recommended) - full Atlas+FSOS-X merged debloat, 126 patterns</Text>
                                        <Name>nexus-gaming</Name>
                                </RadioOption>
                                <RadioOption>
                                        <Text>Core only - safe subset (platform bloat only, keeps Office stubs, OEM apps and third-party Store apps)</Text>
                                        <Name>nexus-core</Name>
                                </RadioOption>
                        </Options>
                        <BottomLine Text="Full list and the keep-guardrails" Link="https://github.com/victoryvpsvn-star/nexus-optimizer"/>
                </RadioPage>
                <RadioPage IsRequired="true" DefaultOption="rp-on" Description="NEXUS can create a System Restore Point before any change is made.">
                        <TopLine Text="Strongly recommended - enables rollback from Windows Recovery. Windows only allows one restore point per 24 hours."/>
                        <Options>
                                <RadioOption>
                                        <Text>Create System Restore Point (recommended)</Text>
                                        <Name>rp-on</Name>
                                </RadioOption>
                                <RadioOption>
                                        <Text>Skip restore point</Text>
                                        <Name>rp-off</Name>
                                </RadioOption>
                        </Options>
                        <BottomLine Text="NEXUS also writes full AppX/services/tasks backups to C:\Windows\NEXUS\Backups either way."/>
                </RadioPage>
                <RadioPage IsRequired="true" DefaultOption="od-remove" Description="OneDrive handling (FSOS-X strip-onedrive style).">
                        <TopLine Text="Removing OneDrive kills its auto-start in existing and future user profiles, plus the Explorer sidebar entry."/>
                        <Options>
                                <RadioOption>
                                        <Text>Remove OneDrive completely (recommended)</Text>
                                        <Name>od-remove</Name>
                                </RadioOption>
                                <RadioOption>
                                        <Text>Keep OneDrive</Text>
                                        <Name>od-keep</Name>
                                </RadioOption>
                        </Options>
                        <BottomLine Text="Reinstall anytime from https://onedrive.live.com or winget install Microsoft.OneDrive"/>
                </RadioPage>
                <RadioPage IsRequired="true" DefaultOption="pm-on" Description="Performance extras (power scheme, timer resolution, power throttling).">
                        <Options>
                                <RadioOption>
                                        <Text>Apply Ultimate Performance + timer resolution + Power Throttling off (recommended for gaming)</Text>
                                        <Name>pm-on</Name>
                                </RadioOption>
                                <RadioOption>
                                        <Text>Skip power scheme changes (laptop on battery, server, etc.)</Text>
                                        <Name>pm-off</Name>
                                </RadioOption>
                        </Options>
                        <BottomLine Text="Desktop users: pm-on. Laptops running on battery most of the time: pm-off."/>
                </RadioPage>
                <RadioPage IsRequired="true" DefaultOption="wl-off" Description="Pin Windows Updates to the current release (Atlas behavior) or let Windows update normally.">
                        <Options>
                                <RadioOption>
                                        <Text>Let Windows Update run normally (recommended)</Text>
                                        <Name>wl-off</Name>
                                </RadioOption>
                                <RadioOption>
                                        <Text>Pin to current release (TargetReleaseVersion policy, Atlas-style)</Text>
                                        <Name>wl-26h2</Name>
                                </RadioOption>
                        </Options>
                        <BottomLine Text="NEXUS ISO ships pinned to 26H2; the playbook defaults to normal updates."/>
                </RadioPage>
        </FeaturePages>
</Playbook>
